<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Hotel Details</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Hotel details</h1>

    <div class="row">
        <form class="col-5">
            <div class="form-group">
                <b><label>ID:</label></b>
                <label th:text="${hotel.id}"></label>
            </div>

            <div class="form-group">
                <b><label>Name:</label></b>
                <label th:text="${hotel.name}"></label>
            </div>

            <div class="form-group">
                <b><label>City:</label></b>
                <label th:text="${hotel.cityName}"></label>
            </div>
            <div class="form-group">
                <b><label>Address:</label></b>
                <label th:text="${hotel.address}"></label>
            </div>
            <div class="form-group">
                <b><label>Description:</label></b>
                <label style="text-align: justify; display: block;" th:text="${hotel.description}"></label>
            </div>
            <div class="form-group">
                <label>Rating:</label>
                <b><label th:text="${averageRating}"></label></b>
            </div>
            <div class="form-group">
                <label>My rating:</label>
                <b><label th:text="${userRating}"></label></b>
            </div>
            <div class="form-group">
                <input type="radio" id="1" name="rating" value="1">
                <label for="1">1</label>
                <input type="radio" id="2" name="rating" value="2">
                <label for="2">2</label>
                <input type="radio" id="3" name="rating" value="3">
                <label for="3">3</label>
                <input type="radio" id="4" name="rating" value="4">
                <label for="4">4</label>
                <input type="radio" id="5" name="rating" value="5">
                <label for="5">5</label>
                <button id="rateHotel" class="btn btn-primary mt-2">Rate</button>
            </div>
        </form>
    </div>
    <div class="mt-2 mb-2">
        <a th:href="@{'/reservations/new/' + ${hotel.id}}">Create a reservation</a>
    </div>

    <hr>

    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <h2 class="mb-1">Hotel snapshots</h2>
            <div th:if="${baselineSnapshot != null}">
                Current baseline:
                <strong th:text="${baselineSnapshot.fileName}"></strong>
            </div>
            <div th:if="${baselineSnapshot == null}" class="text-muted">
                No snapshot has been loaded as a baseline yet.
            </div>
        </div>
        <form th:action="@{'/hotels/' + ${hotel.id} + '/snapshots'}" method="post">
            <button class="btn btn-primary" type="submit">Create snapshot</button>
        </form>
    </div>

    <div th:if="${snapshots.empty}" class="alert alert-secondary">
        No snapshots have been created for this hotel.
    </div>

    <table th:if="${!snapshots.empty}" class="table table-striped table-sm">
        <thead>
        <tr>
            <th>Snapshot</th>
            <th>Created</th>
            <th>Previous baseline</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="snapshot : ${snapshots}"
            th:classappend="${snapshot.baseline} ? 'font-weight-bold' : ''">
            <td th:text="${snapshot.fileName}"></td>
            <td th:text="${snapshot.createdAt}"></td>
            <td th:text="${snapshot.parentFileName != null ? snapshot.parentFileName : '-'}"></td>
            <td th:text="${snapshot.baseline ? 'Baseline' : ''}"></td>
            <td>
                <a th:href="@{'/hotels/' + ${hotel.id} + '/snapshots/' + ${snapshot.id} + '/download'}">Download</a>
                <span class="mx-1">|</span>
                <button type="button"
                        class="btn btn-link p-0 align-baseline"
                        data-toggle="modal"
                        th:attr="data-target=|#snapshotSelection${snapshot.id}|">
                    Download selected
                </button>
                <span th:if="${!snapshot.baseline}" class="mx-1">|</span>
                <form th:if="${!snapshot.baseline}"
                      th:action="@{'/hotels/' + ${hotel.id} + '/snapshots/' + ${snapshot.id} + '/rollback'}"
                      method="post"
                      class="d-inline">
                    <button type="submit" class="btn btn-link p-0 align-baseline text-danger">Rollback</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:each="snapshot : ${snapshots}"
         class="modal fade"
         th:id="|snapshotSelection${snapshot.id}|"
         tabindex="-1"
         role="dialog"
         aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Select snapshot files</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form th:action="@{'/hotels/' + ${hotel.id} + '/snapshots/' + ${snapshot.id} + '/selection'}"
                      method="post">
                    <div class="modal-body">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="files" value="hotel.csv"
                                   th:id="|hotelCsv${snapshot.id}|" checked>
                            <label class="form-check-label" th:for="|hotelCsv${snapshot.id}|">hotel.csv</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="files" value="room-types.csv"
                                   th:id="|roomTypesCsv${snapshot.id}|" checked>
                            <label class="form-check-label" th:for="|roomTypesCsv${snapshot.id}|">room-types.csv</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="files" value="reservations.csv"
                                   th:id="|reservationsCsv${snapshot.id}|" checked>
                            <label class="form-check-label" th:for="|reservationsCsv${snapshot.id}|">reservations.csv</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="files" value="ratings.csv"
                                   th:id="|ratingsCsv${snapshot.id}|" checked>
                            <label class="form-check-label" th:for="|ratingsCsv${snapshot.id}|">ratings.csv</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Download</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="mt-2 mb-2">
        <a href="/hotels">Back to hotels</a>
    </div>

    <script th:inline="javascript">
        const hotelId = [[${hotel.id}]];
    </script>
    <script>
        window.addEventListener('load', function () {

            document.getElementById("rateHotel").addEventListener("click", function () {
                const rating = document.querySelector('input[name="rating"]:checked').value;
                fetch('/ratings', {
                    method: 'POST',
                    body: JSON.stringify({
                        hotelId: hotelId,
                        rating: rating
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                }).then(function () {
                    console.log(window.location)
                    window.location.reload();
                });
            });
        });
    </script>
</div>
</body>
</html>
